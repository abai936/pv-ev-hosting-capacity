[pytest]
# dss_python_backend raises a caught internal exception on import; faulthandler prints it as
# "Windows fatal exception 0xe0465043". The test still passes, so switch faulthandler off.
addopts = -p no:faulthandler
pythonpath = src
markers =
    slow: single test takes more than about 5 s (the 1440-minute benchmark); the clean-clone check deselects these
    needs_data: needs the git-ignored IEEE feeder files (scripts/download_data.py)
